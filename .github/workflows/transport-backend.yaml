name: transport-backend-build

on:
  push:
    branches: [main]
    paths:
      - "apps/transport/backend/**"
      - ".github/workflows/transport-backend.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      name: transport-backend
      context: apps/transport/backend
      manifest: app-deployments/transport/backend/deployment.yaml
      
