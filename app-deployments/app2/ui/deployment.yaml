apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-ui
  namespace: app2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2-ui
  template:
    metadata:
      labels:
        app: app2-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/xtemplate24/app2-ui@sha256:5f034c9c90b0a230924e916bfdb4a4aee8e36aa05a768e9a336fdaca9adf9f6b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp