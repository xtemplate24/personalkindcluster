name: transport-frontend-build

on:
  push:
    branches: [main]
    paths:
      - "apps/transport/frontend/**"
      - ".github/workflows/transport-frontend.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      name: transport-frontend
      context: apps/transport/frontend
      manifest: app-deployments/transport/frontend/deployment.yaml
      
