apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-backend
  namespace: app3
spec:
  replicas: 1
  # ReadWriteOnce volume + SQLite = only one pod may use it at a time,
  # so stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app3-backend
  template:
    metadata:
      labels:
        app: app3-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # The build-image pipeline fills in the @sha256 digest after the first push.
          image: ghcr.io/xtemplate24/app3-backend@sha256:86653699e21b912d71fa471f15163b30d74bae6a8c0b4bcbcce454503b8c1d80
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_PATH
              value: /data/app3.db
          ports:
            - containerPort: 8080
              name: api
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /data
              name: data
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app3-data
        - emptyDir: {}
          name: tmp