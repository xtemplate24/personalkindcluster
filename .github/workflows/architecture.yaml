name: architecture-build
on:
  push:
    branches: [main]
    paths:
      - "apps/architecture/**"
      - ".github/workflows/architecture.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      name: architecture
      context: apps/architecture
      manifest: app-deployments/architecture/deployment.yaml
