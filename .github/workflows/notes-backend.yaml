name: notes-backend-build

on:
  push:
    branches: [main]
    paths:
      - "apps/notes/backend/**"
      - ".github/workflows/notes-backend.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      name: notes-backend
      context: apps/notes/backend
      manifest: app-deployments/notes/backend/deployment.yaml
      
