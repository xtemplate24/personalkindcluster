apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: architecture-ingress
  namespace: architecture
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Deliberately NO router.middlewares annotation: this is a public app,
    # so it is not behind oauth2-proxy. It is static files only.
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - architecture.xtemplate.cc
  rules:
    - host: architecture.xtemplate.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: architecture-svc
                port:
                  name: http
