# .github/workflows/cleanup-registry.yaml
name: cleanup-registry

on:
  schedule:
    - cron: "0 3 * * 0"  # weekly, Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      matrix:
        package: [hello-nginx, second-page, landing, app1-frontend, app1-backend, app2-llm, app2-ui, app3-frontend, app3-backend]
    steps:
      - name: Delete old versions of ${{ matrix.package }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 5