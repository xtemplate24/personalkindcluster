apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1-ingress
  namespace: app1
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app1.xtemplate.cc
  rules:
    - host: app1.xtemplate.cc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-frontend-svc
                port:
                  name: http