apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: landing-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Updated automatically by the build-image pipeline once this app has a workflow.
          image: ghcr.io/xtemplate24/landing@sha256:4bfe16c99f3aa8c4e07956f1ef5d57fc522b00fb4f07c074a5d0be28490abe6f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
        - emptyDir: {}
          name: nginx-cache
        - emptyDir: {}
          name: nginx-run