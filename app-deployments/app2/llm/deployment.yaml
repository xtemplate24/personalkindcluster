apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-llm
  namespace: app2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2-llm
  template:
    metadata:
      labels:
        app: app2-llm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm
          image: ghcr.io/xtemplate24/app2-llm@sha256:b574f176ac368297a302af9e4d542746f41f13822ca660d7aeb457796ad8377c
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: LLAMA_CACHE
              value: /tmp
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "4", memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp