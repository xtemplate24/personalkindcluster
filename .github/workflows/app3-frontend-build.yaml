name: app3-frontend-build

on:
  push:
    branches: [main]
    paths:
      - "apps/app3/frontend/**"
      - ".github/workflows/app3-frontend.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

# jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      name: app3-frontend
      context: apps/app3/frontend
      manifest: app-deployments/app3/frontend/deployment.yaml