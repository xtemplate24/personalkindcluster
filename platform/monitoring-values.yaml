prometheus:
  prometheusSpec:
    retention: 5d              # delete data older than 5 days
    retentionSize: 8GB         # or once it hits 8 GB, whichever comes first
    scrapeInterval: 60s        # collect every 60s (default 30s) - half the writes
    serviceMonitorSelectorNilUsesHelmValues: false  # find monitors in any namespace
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1536Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-discord 
    retention: 120h            # 5 days
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 128Mi }
  config:
    route:
      receiver: discord          # everything goes to Discord by default...
      group_by: ['alertname', 'namespace']
      group_wait: 30s            # wait 30s to batch related alerts together
      group_interval: 5m
      repeat_interval: 12h       # re-send an unresolved alert every 12h, not constantly
      routes:
        - receiver: 'null'       # ...except these, which are dropped
          matchers: ['alertname = "Watchdog"']        # a heartbeat that fires all the time on purpose
        - receiver: 'null'
          matchers: ['alertname = "InfoInhibitor"']
        - receiver: 'null'
          matchers: ['severity = "info"']             # low-priority noise
    receivers:
      - name: 'null'
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true  # also tell you when it's fixed

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi

# k3s bundles these components into one process, so the chart can't scrape
# them separately. Leaving them on just produces permanent "target down" alerts.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }