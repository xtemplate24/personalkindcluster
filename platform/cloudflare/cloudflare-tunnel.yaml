apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-tunnel
  namespace: landing-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-tunnel-secret  # <-- References your secret name
              key: tunnel-token               # <-- References the key inside the secret
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-svc
  namespace: landing-app
spec:
  selector:
    app: cloudflared
  ports:
  - port: 80
    targetPort: 80
