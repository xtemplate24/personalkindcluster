apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-ingress
  namespace: landing-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - xtemplate.lab
  rules:
    - host: xtemplate.lab
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: landing-svc
                port:
                  name: http
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: landing-svc
                port:
                  name: http
