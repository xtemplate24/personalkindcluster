apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-frontend
  namespace: app3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3-frontend
  template:
    metadata:
      labels:
        app: app3-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # The build-image pipeline fills in the @sha256 digest after the first push.
          image: ghcr.io/xtemplate24/app3-frontend@sha256:b209c2cc54407fe1fce21126762a4440a0cb9be9178ca85998acd8b161d79d42
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp